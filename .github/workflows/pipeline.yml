name: Smart Finance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this tested main commit to the configured Ubuntu server
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: compose.yaml:compose.nginx.yaml
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Deployment helper checks
        run: |
          python3 -m unittest discover -s scripts/tests -v
          bash -n scripts/deploy.sh
      - name: Prepare ephemeral configuration
        run: python3 scripts/configure.py
      - name: Build and start isolated app
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: PostgreSQL tests and migration checks
        run: python3 scripts/test_docker.py
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
      - name: Seed disposable browser account
        run: python3 scripts/seed_demo.py
      - name: Desktop and mobile browser tests
        working-directory: frontend
        run: |
          # Ubuntu 24.04 runners ship Chrome and its system dependencies.
          SF_CHROME_PATH="$(command -v google-chrome)"
          "$SF_CHROME_PATH" --version
          export SF_CHROME_PATH
          npx playwright test
      - name: Backup and restore verification
        run: |
          sh scripts/backup.sh
          python3 scripts/verify_restore.py
      - name: Remove ephemeral databases and credentials
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -rf .env artifacts backups
  build-images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Build and push native images
        env:
          REPOSITORY: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          repo="${REPOSITORY,,}"
          for service in backend web; do
            context="$service"
            if [[ "$service" == web ]]; then context=frontend; fi
            image="ghcr.io/$repo/$service:$GITHUB_SHA-$ARCH"
            docker build --platform "linux/$ARCH" -t "$image" "$context"
            docker push "$image"
          done
      - name: Remove registry session
        if: always()
        run: docker logout ghcr.io
  publish:
    needs: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      web: ${{ steps.images.outputs.web }}
    steps:
      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Publish multi-platform release images
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repo="${REPOSITORY,,}"
          for service in backend web; do
            image="ghcr.io/$repo/$service:$GITHUB_SHA"
            docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
            docker buildx imagetools inspect --raw "$image" | jq -e '
              ([.manifests[].platform | select(.os == "linux") | .architecture] | unique)
              == ["amd64", "arm64"]' > /dev/null
            echo "$service=$image" >> "$GITHUB_OUTPUT"
          done
      - name: Remove registry session
        if: always()
        run: docker logout ghcr.io
  deploy:
    if: vars.AUTO_DEPLOY != 'true' && github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      BACKEND_IMAGE: ${{ needs.publish.outputs.backend }}
      WEB_IMAGE: ${{ needs.publish.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Transfer exact source and deploy through verified SSH
        run: python3 scripts/ci_deploy.py
  deploy-home:
    if: vars.AUTO_DEPLOY == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: [verify, publish]
    runs-on:
      - self-hosted
      - linux
      - ${{ vars.LOCAL_DEPLOY_ARCH || 'arm64' }}
      - smart-finance
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy tested images on the configured server
        env:
          LOCAL_DEPLOY_PATH: ${{ vars.LOCAL_DEPLOY_PATH }}
          LOCAL_DEPLOY_GATEWAY: ${{ vars.LOCAL_DEPLOY_GATEWAY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy_local.py
