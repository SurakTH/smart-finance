# Include INSIDE your existing HTTPS server { ... } block, on the Docker host.
# Example: include /absolute/path/smart-finance/deploy/nginx/host-location.conf;
# Serve Smart Finance on its own domain/subdomain at /.
client_max_body_size 10m;
access_log off;
error_log /var/log/nginx/smart-finance-error.log crit;
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    gzip off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
}
