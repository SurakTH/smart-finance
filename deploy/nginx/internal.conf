# Included in the Docker image's http context.
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    access_log off;
    error_log /dev/stderr crit;
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    gzip off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    # Avoid persisting chat/slip bodies in Nginx request temporary files.
    proxy_request_buffering off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        set $api api:8000;
        # Remove only the gateway prefix; retain query strings for pagination/SSE.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api;
    }
    location / {
        set $web web:3000;
        proxy_pass http://$web;
    }
}
